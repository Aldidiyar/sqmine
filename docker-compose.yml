# =============================================================================
# One command brings up a Jenkins that already knows about this project:
#
#   docker compose up -d --build
#
# then open http://localhost:8080 and sign in as admin / admin (override with
# JENKINS_ADMIN_PASSWORD). The sqmine-ci job is already there; nothing has to
# be created through the interface.
# =============================================================================

services:
  jenkins:
    build:
      context: ./jenkins
    image: sqmine-jenkins:local
    container_name: sqmine-jenkins
    restart: unless-stopped

    # Running the controller as root is what makes the mounted Docker socket
    # usable without matching the host's docker group id, which differs
    # between Linux and Docker Desktop. It is a convenience for a local
    # teaching setup and would not be acceptable on a shared controller: a
    # process that can talk to the socket can start a privileged container and
    # own the host.
    user: root

    ports:
      - "8080:8080"     # web interface
      - "50000:50000"   # inbound agents, unused in this single-node setup

    environment:
      JENKINS_ADMIN_ID: "${JENKINS_ADMIN_ID:-admin}"
      JENKINS_ADMIN_PASSWORD: "${JENKINS_ADMIN_PASSWORD:-admin}"
      JENKINS_URL: "${JENKINS_URL:-http://localhost:8080/}"
      SQMINE_REPOSITORY: "${SQMINE_REPOSITORY:-https://github.com/Aldidiyar/sqmine.git}"
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false"
      CASC_JENKINS_CONFIG: "/var/jenkins_conf/casc.yaml"

    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/login"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s

volumes:
  jenkins_home:
