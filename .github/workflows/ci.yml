name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to the same branch cancels the run already in flight. On a free
# runner allowance that matters more than keeping the history of every
# intermediate commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, format and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check --output-format=github .

      - name: Formatting
        run: ruff format --check --diff .

      - name: Types
        run: python -m mypy

  test:
    name: Tests on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: >
          python -m pytest
          --cov=sqmine
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=90

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  smoke:
    name: Command-line smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      # The README promises these three commands work. This job is what keeps
      # that promise true: documentation that is never executed goes stale.
      - name: Run the documented pipeline
        run: |
          python -c "import secrets, pathlib; pathlib.Path('ci.key').write_bytes(secrets.token_bytes(32))"
          sqmine ingest examples/crm_sample.csv \
            --adapter crm-csv --tenant ci --key-file ci.key \
            --out episodes.jsonl --fail-under 0.8
          sqmine ingest examples/contact_centre_sample.json \
            --adapter contact-centre-json --tenant ci --key-file ci.key \
            --out calls.jsonl --fail-under 0.8
          sqmine features episodes.jsonl --out features.csv --stats
          sqmine agreement examples/labels_sample.csv \
            --col-a annotator_a --col-b annotator_b

      - name: Check that no raw identifier survived ingestion
        run: |
          if grep -qE 'CL-[0-9]+|OP-[0-9]+' episodes.jsonl; then
            echo "::error::a raw identifier reached the canonical output"
            exit 1
          fi
          echo "no raw identifiers found"

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 14
